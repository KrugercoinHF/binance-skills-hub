services:
  viewer:
    image: node:22-slim
    working_dir: /app
    volumes:
      - .:/app
    command: node viewer/server.js
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
      - BASE44_SANDBOX_HOST_DOMAIN=${BASE44_SANDBOX_HOST_DOMAIN}
