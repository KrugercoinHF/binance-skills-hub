<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Binance Skills Hub</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #0b0e11;
      --surface: #161a1e;
      --surface-2: #1e2329;
      --border: #2b3139;
      --gold: #f0b90b;
      --gold-dim: #c99400;
      --text: #eaecef;
      --text-dim: #848e9c;
      --text-faint: #5e6673;
      --green: #0ecb81;
      --radius: 12px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    /* header */
    .header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(11,14,17,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex; align-items: center; gap: 16px;
    }
    .logo {
      display: flex; align-items: center; gap: 10px;
      font-size: 20px; font-weight: 700; color: var(--gold);
      cursor: pointer; white-space: nowrap;
    }
    .logo svg { width: 28px; height: 28px; }
    .search-box {
      flex: 1; max-width: 480px;
      position: relative;
    }
    .search-box input {
      width: 100%;
      padding: 10px 16px 10px 40px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-box input:focus { border-color: var(--gold-dim); }
    .search-box::before {
      content: "🔍"; position: absolute; left: 12px; top: 50%;
      transform: translateY(-50%); font-size: 14px; opacity: 0.5;
    }
    .skill-count {
      color: var(--text-dim); font-size: 13px; white-space: nowrap;
    }
    /* layout */
    .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
    /* category sections */
    .category { margin-bottom: 40px; }
    .category-title {
      font-size: 13px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--text-dim);
      margin-bottom: 16px; padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .skill-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }
    .skill-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex; flex-direction: column; gap: 8px;
    }
    .skill-card:hover {
      border-color: var(--gold-dim);
      background: var(--surface-2);
      transform: translateY(-2px);
    }
    .skill-card .card-header {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .skill-card h3 {
      font-size: 16px; font-weight: 600; color: var(--text);
    }
    .skill-card .version {
      font-size: 11px; color: var(--gold);
      background: rgba(240,185,11,0.1);
      padding: 2px 8px; border-radius: 4px;
      white-space: nowrap;
    }
    .skill-card .description {
      font-size: 13px; color: var(--text-dim);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .skill-card .card-footer {
      display: flex; align-items: center; gap: 8px;
      margin-top: 4px;
    }
    .skill-card .author {
      font-size: 12px; color: var(--text-faint);
    }
    .skill-card .badge {
      font-size: 11px; color: var(--green);
      background: rgba(14,203,129,0.1);
      padding: 2px 8px; border-radius: 4px;
    }
    /* detail view */
    .detail-view { padding: 24px; max-width: 900px; margin: 0 auto; }
    .back-btn {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--text-dim); font-size: 14px; cursor: pointer;
      margin-bottom: 24px; border: none; background: none;
      transition: color 0.2s;
    }
    .back-btn:hover { color: var(--gold); }
    .detail-header { margin-bottom: 24px; }
    .detail-header h1 { font-size: 28px; margin-bottom: 8px; }
    .detail-header .meta-row {
      display: flex; gap: 12px; flex-wrap: wrap; margin-top: 12px;
    }
    .detail-header .meta-tag {
      font-size: 12px; padding: 4px 12px; border-radius: 6px;
      background: var(--surface-2); border: 1px solid var(--border);
      color: var(--text-dim);
    }
    .detail-header .description {
      color: var(--text-dim); font-size: 15px; margin-top: 12px;
    }
    .tab-bar {
      display: flex; gap: 4px; margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }
    .tab {
      padding: 10px 16px; font-size: 14px; cursor: pointer;
      color: var(--text-dim); border: none; background: none;
      border-bottom: 2px solid transparent; white-space: nowrap;
      transition: all 0.2s;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--gold); border-bottom-color: var(--gold); }
    .markdown-body {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
      font-size: 14px;
      overflow-x: auto;
    }
    .markdown-body h1, .markdown-body h2, .markdown-body h3 {
      margin-top: 24px; margin-bottom: 12px; color: var(--text);
    }
    .markdown-body h1 { font-size: 22px; }
    .markdown-body h2 { font-size: 18px; }
    .markdown-body h3 { font-size: 16px; }
    .markdown-body p { margin-bottom: 12px; color: var(--text-dim); }
    .markdown-body ul, .markdown-body ol { margin-bottom: 12px; padding-left: 24px; color: var(--text-dim); }
    .markdown-body li { margin-bottom: 4px; }
    .markdown-body code {
      background: var(--surface-2); padding: 2px 6px;
      border-radius: 4px; font-size: 13px; color: var(--gold);
      font-family: 'SF Mono', Monaco, monospace;
    }
    .markdown-body pre {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 16px; overflow-x: auto;
      margin-bottom: 16px;
    }
    .markdown-body pre code {
      background: none; padding: 0; color: var(--text);
    }
    .markdown-body table {
      width: 100%; border-collapse: collapse; margin-bottom: 16px;
      font-size: 13px;
    }
    .markdown-body th, .markdown-body td {
      border: 1px solid var(--border); padding: 8px 12px;
      text-align: left;
    }
    .markdown-body th { background: var(--surface-2); color: var(--text); }
    .markdown-body td { color: var(--text-dim); }
    .markdown-body a { color: var(--gold); text-decoration: none; }
    .markdown-body a:hover { text-decoration: underline; }
    .markdown-body blockquote {
      border-left: 3px solid var(--gold-dim); padding-left: 16px;
      color: var(--text-dim); margin-bottom: 16px;
    }
    .markdown-body hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
    .loading { text-align: center; padding: 60px; color: var(--text-dim); }
    .hidden { display: none; }
    /* hero */
    .hero {
      text-align: center; padding: 48px 24px 32px;
    }
    .hero h1 {
      font-size: 36px; font-weight: 800; margin-bottom: 12px;
      background: linear-gradient(135deg, var(--gold), #fff);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .hero p { color: var(--text-dim); font-size: 16px; max-width: 600px; margin: 0 auto; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo" onclick="showList()">
      <svg viewBox="0 0 126.61 126.61" fill="currentColor"><path d="M45.34,32.29h36.08l-18.1,18.1L45.34,32.29z M63.31,76.4L45.21,58.3l-18.1,18.1h36.2L63.31,76.4z M81.41,58.3l-18.1,18.1L45.21,58.3l-18.1,18.1h36.2L81.41,58.3z M81.41,58.3l18.1-18.1h-36.2L81.41,58.3z"/></svg>
      Binance Skills Hub
    </div>
    <div class="search-box">
      <input type="text" id="search" placeholder="Search skills..." oninput="filterSkills()" />
    </div>
    <div class="skill-count" id="count"></div>
  </div>

  <div id="list-view">
    <div class="hero">
      <h1>Open Skills Marketplace for AI Agents</h1>
      <p>Give AI agents native access to crypto — search tokens, execute trades, track wallets, monitor signals, and interact with DeFi protocols.</p>
    </div>
    <div class="container" id="skills-container">
      <div class="loading">Loading skills...</div>
    </div>
  </div>

  <div id="detail-view" class="detail-view hidden"></div>

  <script>
    let allSkills = [];
    let currentSkill = null;

    async function init() {
      const res = await fetch("/api/skills");
      allSkills = await res.json();
      renderSkills(allSkills);
      // route handling
      const hash = window.location.hash.slice(1);
      if (hash) showSkill(hash);
    }

    function renderSkills(skills) {
      document.getElementById("count").textContent = `${skills.length} skill${skills.length !== 1 ? "s" : ""}`;
      const container = document.getElementById("skills-container");
      if (skills.length === 0) {
        container.innerHTML = '<div class="loading">No skills found.</div>';
        return;
      }
      // group by category
      const categories = {};
      for (const s of skills) {
        if (!categories[s.category]) categories[s.category] = [];
        categories[s.category].push(s);
      }
      let html = "";
      for (const [cat, items] of Object.entries(categories).sort()) {
        html += `<div class="category"><div class="category-title">${cat}</div><div class="skill-grid">`;
        for (const s of items) {
          const desc = s.description.replace(/\n/g, " ").slice(0, 200);
          html += `<div class="skill-card" onclick="showSkill('${s.slug}')">
            <div class="card-header">
              <h3>${s.title}</h3>
              ${s.version ? `<span class="version">v${s.version}</span>` : ""}
            </div>
            <div class="description">${desc}</div>
            <div class="card-footer">
              ${s.author ? `<span class="author">by ${s.author}</span>` : ""}
            </div>
          </div>`;
        }
        html += `</div></div>`;
      }
      container.innerHTML = html;
    }

    function filterSkills() {
      const q = document.getElementById("search").value.toLowerCase();
      const filtered = allSkills.filter(s =>
        s.title.toLowerCase().includes(q) ||
        s.description.toLowerCase().includes(q) ||
        s.category.toLowerCase().includes(q)
      );
      renderSkills(filtered);
    }

    async function showSkill(slug) {
      window.location.hash = slug;
      const res = await fetch(`/api/skill/${encodeURIComponent(slug)}`);
      if (!res.ok) return;
      currentSkill = await res.json();
      const view = document.getElementById("detail-view");
      document.getElementById("list-view").classList.add("hidden");
      view.classList.remove("hidden");

      let tabsHtml = `<button class="tab active" onclick="showTab(this, 'main')">Overview</button>`;
      if (currentSkill.references && currentSkill.references.length > 0) {
        for (const ref of currentSkill.references) {
          tabsHtml += `<button class="tab" onclick="showTab(this, '${ref.slug}')">${ref.slug}</button>`;
        }
      }

      view.innerHTML = `
        <button class="back-btn" onclick="showList()">← Back to skills</button>
        <div class="detail-header">
          <h1>${currentSkill.title}</h1>
          <div class="description">${currentSkill.description.replace(/\n/g, " ")}</div>
          <div class="meta-row">
            ${currentSkill.version ? `<span class="meta-tag">v${currentSkill.version}</span>` : ""}
            ${currentSkill.author ? `<span class="meta-tag">by ${currentSkill.author}</span>` : ""}
            <span class="meta-tag">${currentSkill.category}</span>
          </div>
        </div>
        <div class="tab-bar">${tabsHtml}</div>
        <div id="tab-content" class="markdown-body"></div>
      `;
      showTabContent("main");
    }

    function showTab(btn, tabName) {
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      btn.classList.add("active");
      showTabContent(tabName);
    }

    function showTabContent(tabName) {
      const el = document.getElementById("tab-content");
      if (tabName === "main") {
        el.innerHTML = marked.parse(currentSkill.body);
      } else {
        // load reference
        fetch(`/api/reference/${encodeURIComponent(currentSkill.slug + "/" + tabName)}`)
          .then(r => r.json())
          .then(data => { el.innerHTML = marked.parse(data.body); })
          .catch(() => { el.innerHTML = "<p>Failed to load reference.</p>"; });
      }
    }

    function showList() {
      window.location.hash = "";
      document.getElementById("detail-view").classList.add("hidden");
      document.getElementById("list-view").classList.remove("hidden");
    }

    window.addEventListener("hashchange", () => {
      const hash = window.location.hash.slice(1);
      if (!hash) showList();
    });

    init();
  </script>
</body>
</html>
